[project]
name = "agent-kb"
version = "0.1.0"
description = "Drop-in knowledge base for LLM coding agents: Qdrant-backed RAG over your repo's docs, ontology, and make targets, exposed as MCP tools"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sergei Fedorov" }]
requires-python = ">=3.11"
keywords = ["mcp", "rag", "qdrant", "llm-agents", "knowledge-base"]
dependencies = [
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "mcp>=1.0.0",
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.urls]
Repository = "https://github.com/zmij/agent-kb"

[project.scripts]
kb = "kb.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
