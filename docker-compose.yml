# Qdrant vector store backing the knowledge base.
#
# Standalone bring-up: `make up` (or `docker compose up -d`). Consuming
# repos that already run their own compose stack can instead add this
# service to it — the kb.mk module's KB_COMPOSE variable points at
# whichever compose invocation owns the qdrant service.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: agent-kb-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
    name: agent-kb-qdrant-storage
